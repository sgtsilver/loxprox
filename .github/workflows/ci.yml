name: CI

# Least-privilege token for every job: CI only reads the repo. No job writes
# to contents, issues, PRs, or packages.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: '.'
        env:
          SHELLCHECK_OPTS: -x

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check all shell scripts
        run: |
          set -e
          for f in deploy.sh detect-loxone.sh test-gateway.sh set-static-ip.sh security-monitoring/*.sh tests/*.sh; do
            if [[ -f "$f" ]]; then
              echo "Checking: $f"
              bash -n "$f"
            fi
          done
          echo "All scripts pass syntax check."

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run Python unit tests
        run: pytest tests/ -v

  shell-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run portable shell unit tests
        run: bash tests/run-tests.sh shell

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Integration test — config generation in Debian 12 container
        run: |
          set -e
          docker run --rm -v "$PWD:/workspace" -w /workspace debian:12 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq curl gnupg nginx nftables bc jq > /dev/null 2>&1 || true

            echo "=== Running portable unit tests inside Debian 12 ==="
            bash tests/run-tests.sh

            echo ""
            echo "=== Validating deploy.sh config generation ==="
            # Verify key functions produce syntactically valid configs
            export LOXONE_IP="192.168.1.100"
            export LOXONE_PORT="80"
            export GATEWAY_IP="192.168.1.50"
            export LAN_SUBNET="192.168.1.0/24"
            export SSH_ALLOWED_SUBNETS=("192.168.1.0/24")
            export RATE_LIMIT_REQ_PER_SEC="10"
            export RATE_LIMIT_BURST="100"
            export RATE_LIMIT_CONN_PER_IP="20"
            export PROXY_CONNECT_TIMEOUT="10"
            export PROXY_SEND_TIMEOUT="15"
            export PROXY_READ_TIMEOUT="15"
            export CLIENT_BODY_TIMEOUT="10"
            export CLIENT_HEADER_TIMEOUT="10"
            export ENABLE_APPSEC="true"
            export APPSEC_MODE="enforce"
            export CROWDSEC_WHITELIST_IPS=("192.168.1.0/24")
            export DISCORD_WEBHOOK_URL=""
            export ALERT_EMAIL=""
            export AUTOREBOOT_TIME="03:00"

            # Override paths
            export LOG_FILE="/tmp/loxprox-deploy.log"
            export BACKUP_DIR="/tmp/loxprox-backup-test"
            export NGINX_SITE="/tmp/nginx-sites/loxone"
            export NGINX_ENABLED="/tmp/nginx-sites-enabled/loxone"
            export NFTABLES_CONF="/tmp/nftables.conf"
            export SYSCTL_CONF="/tmp/sysctl.conf"
            export LOGROTATE_CONF="/tmp/logrotate.conf"
            export GATEWAY_CONFIG_DIR="/tmp/loxprox"
            export GATEWAY_CONFIG_FILE="$GATEWAY_CONFIG_DIR/config.env"

            mkdir -p /tmp/nginx-sites /tmp/nginx-sites-enabled /tmp/loxprox

            # Mock system commands that need real services
            systemctl() { true; }
            apt-get() { true; }
            dpkg() { true; }
            cscli() { true; }
            export -f systemctl apt-get dpkg cscli

            # Source deploy.sh functions
            source deploy.sh

            apply_sysctls
            setup_firewall
            configure_nginx
            setup_logrotate
            write_runtime_config

            # Validate generated configs
            if [[ ! -f "$NGINX_SITE" ]]; then echo "FAIL: nginx site missing"; exit 1; fi
            if ! grep -q "listen 1080" "$NGINX_SITE"; then echo "FAIL: listen 1080 missing"; exit 1; fi
            if ! grep -q "Content-Security-Policy" "$NGINX_SITE"; then echo "FAIL: CSP missing"; exit 1; fi
            if grep -qE "^[[:space:]]*add_header[[:space:]]+X-XSS-Protection" "$NGINX_SITE"; then echo "FAIL: X-XSS-Protection should not be added"; exit 1; fi
            if ! grep -q "proxy_hide_header X-XSS-Protection;" "$NGINX_SITE"; then echo "FAIL: upstream X-XSS-Protection not hidden"; exit 1; fi
            if ! grep -q "proxy_hide_header X-Frame-Options;" "$NGINX_SITE"; then echo "FAIL: upstream X-Frame-Options not hidden"; exit 1; fi
            if ! grep -q "proxy_hide_header Server" "$NGINX_SITE"; then echo "FAIL: proxy_hide_header missing"; exit 1; fi

            if [[ ! -f "$NFTABLES_CONF" ]]; then echo "FAIL: nftables.conf missing"; exit 1; fi
            if ! grep -q "policy drop" "$NFTABLES_CONF"; then echo "FAIL: nftables policy not drop"; exit 1; fi
            if ! grep -q "ip6 saddr @geoip_blocklist6 drop" "$NFTABLES_CONF"; then echo "FAIL: IPv6 GeoIP drop rule missing"; exit 1; fi
            if ! grep -q "loxprox-egress" "$NFTABLES_CONF"; then echo "FAIL: nginx egress rules missing"; exit 1; fi
            if ! grep -qx "server_tokens off;" "$NGINX_SITE"; then echo "FAIL: server_tokens off missing"; exit 1; fi

            if [[ ! -f "$SYSCTL_CONF" ]]; then echo "FAIL: sysctl.conf missing"; exit 1; fi
            if ! grep -q "tcp_syncookies = 1" "$SYSCTL_CONF"; then echo "FAIL: syncookies missing"; exit 1; fi

            if [[ ! -f "$LOGROTATE_CONF" ]]; then echo "FAIL: logrotate missing"; exit 1; fi
            if ! grep -q "appsec-detections.log" "$LOGROTATE_CONF"; then echo "FAIL: appsec logrotate missing"; exit 1; fi

            if [[ ! -f "$GATEWAY_CONFIG_FILE" ]]; then echo "FAIL: runtime config missing"; exit 1; fi

            echo ""
            echo "=== All integration validations passed ==="
          '

  # The checks below run deploy.sh's own functions against REAL services on a
  # throwaway runner / container (tests/host-integration.sh refuses to run
  # without CI=true). They prove what the portable suite can only mock.

  host-services:
    name: Host integration — cron, journald, auditd, panel, install dir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cron + auditd
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cron auditd jq >/dev/null
          systemctl --no-pager --quiet is-active cron auditd systemd-journald

      - name: cron / journald / auditd / panel / install dir against the real daemons
        run: sudo CI=true bash tests/host-integration.sh cron journald auditd panel-job install-dir launch-env panel-stop

  logrotate-debian12:
    name: Host integration — logrotate + cron unit (Debian 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Debian 12 logrotate with the stock nginx stanza present
        run: |
          docker run --rm -e CI=true -v "$PWD:/workspace" -w /workspace debian:12 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq logrotate nginx cron > /dev/null 2>&1
            echo "--- stock /etc/logrotate.d/nginx:"; cat /etc/logrotate.d/nginx
            bash tests/host-integration.sh logrotate cron-unit
          '

  apparmor-nginx:
    name: AppArmor profile — parser + nginx-extras runtime, proxied headers, AppSec log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: apparmor_parser (Debian 12's parser + abstractions) accepts the profile
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace debian:12 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq apparmor > /dev/null 2>&1
            apparmor_parser --version | head -1
            # -Q: compile fully, do not load into the kernel; -T/-K: no cache.
            apparmor_parser -QTK apparmor/usr.sbin.nginx
            echo "OK: profile compiles"
            # Negative control — the step must be able to fail.
            cp apparmor/usr.sbin.nginx /tmp/broken.profile
            sed -i "s#/run/nginx.pid.oldbin rw,#/run/nginx.pid.oldbin rwq,#" /tmp/broken.profile
            if apparmor_parser -QTK /tmp/broken.profile 2>/dev/null; then
              echo "FAIL: parser accepted a broken permission string"; exit 1
            fi
            echo "OK: parser rejects a broken copy"
          '

      - name: apparmor_parser (runner kernel) accepts the profile
        run: sudo apparmor_parser -QTK apparmor/usr.sbin.nginx && echo "OK"

      - name: nginx-extras (Debian 12) — profile complain/enforce, headers, AppSec detection log
        run: sudo CI=true bash tests/host-integration.sh nginx-apparmor nginx-appsec

  # 2026-10 breach hardening: the edge, the firewall, the host config and the
  # CrowdSec ban configuration against the real programs.
  edge-nginx:
    name: Host integration — Host/SNI gate, path classes, limits (nginx-extras, Debian 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gateway site + TLS block + trap servers against a real nginx-extras
        run: sudo CI=true bash tests/host-integration.sh nginx-edge

  debian12-host-config:
    name: Host integration — nft -c, unattended-upgrades origins, sshd -t (Debian 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: nftables ruleset, u-u matcher, sshd drop-in in Debian 12 containers
        run: sudo CI=true bash tests/host-integration.sh nft-check debian12-host

  crowdsec-scenarios:
    name: Host integration — CrowdSec scenarios, profiles, retention, simulation, hub-update timer
    # Pinned: the packagecloud CrowdSec repository must carry this release.
    runs-on: ubuntu-24.04
    env:
      # The CrowdSec release production runs. Bump it together with the gateway;
      # the job fails (listing what the repository has) instead of testing another one.
      CROWDSEC_CI_VERSION: "1.8.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install CrowdSec ${{ env.CROWDSEC_CI_VERSION }} from its packagecloud repository (production's source)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/crowdsec-gpgkey.asc https://packagecloud.io/crowdsec/crowdsec/gpgkey
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/crowdsec-archive-keyring.gpg /tmp/crowdsec-gpgkey.asc
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/ubuntu ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/crowdsec.list >/dev/null
          sudo apt-get update -qq
          # Exact upstream version only (1.8.1 or a 1.8.1-<build> package revision,
          # never 1.8.10) — no silent fallback to whatever is newest.
          # madison lines: "  crowdsec | 1.8.1 | https://packagecloud.io/... noble/main amd64 Packages"
          avail=$(apt-cache madison crowdsec 2>&1) || true
          ver=$(awk -v want="$CROWDSEC_CI_VERSION" '
            $1 == "crowdsec" && $2 == "|" {
              v = $3
              if (v == want || index(v, want "-") == 1 || index(v, want "~") == 1 || index(v, want "+") == 1) {
                print v; exit
              }
            }' <<<"$avail")
          if [[ -z "$ver" ]]; then
            echo "::error::crowdsec $CROWDSEC_CI_VERSION is not in the packagecloud repository for ${VERSION_CODENAME}. Available:"
            printf '%s\n' "${avail:-<none>}"
            exit 1
          fi
          echo "Installing crowdsec=$ver"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "crowdsec=$ver" jq >/dev/null
          sudo cscli version
          # The package starts the agent, which need not be active the moment
          # apt returns. Up to 60 s, then a real verdict.
          for _ in $(seq 1 60); do
            systemctl is-active --quiet crowdsec && break
            sleep 1
          done
          systemctl is-active crowdsec

      - name: configure_crowdsec, cscli explain and a replay against the real daemon
        run: sudo CI=true bash tests/host-integration.sh crowdsec

      - name: The package's crowdsec-hubupdate.timer masked by deploy.sh (real unit, real systemd, package reinstall)
        run: sudo CI=true bash tests/host-integration.sh crowdsec-hubupdate

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Markdown link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --exclude-path phase2-gateway/ README.md SECURITY.md CONFIGURATION-GUIDE.md CONTRIBUTING.md CHANGELOG.md
          fail: false
